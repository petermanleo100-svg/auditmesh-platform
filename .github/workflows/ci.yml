name: ci
on: [push,pull_request]
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
   - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
     with: {python-version: "3.12",cache: pip}
   - run: pip install -e ".[test]"
   - run: pytest -q
   - run: pip check
   - name: Audit Python dependency vulnerabilities
     run: python scripts/verify_dependency_manifest.py && pip-audit -r requirements-audit.txt
   - name: Validate Prometheus alert rules
     run: |
      docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/prometheus:/rules:ro" prom/prometheus:v3.11.3 check rules /rules/auditmesh-alerts.yml
      docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/prometheus:/rules:ro" -w /rules prom/prometheus:v3.11.3 test rules auditmesh-alerts.test.yml
 postgres:
  runs-on: ubuntu-latest
  services:
   postgres:
    image: postgres:17.6-alpine
    env: {POSTGRES_DB: auditmesh,POSTGRES_USER: auditmesh,POSTGRES_PASSWORD: auditmesh}
    ports: ["5432:5432"]
    options: >-
     --health-cmd "pg_isready -U auditmesh" --health-interval 5s --health-timeout 3s --health-retries 20
  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
   - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
     with: {python-version: "3.12",cache: pip}
   - run: pip install -e ".[test]"
   - env: {AUDITMESH_DATABASE_URL: "postgresql+psycopg://auditmesh:auditmesh@localhost:5432/auditmesh"}
     run: alembic upgrade head
   - env: {TEST_POSTGRES_URL: "postgresql+psycopg://auditmesh:auditmesh@localhost:5432/auditmesh"}
     run: pytest -q tests/test_postgres.py
   - name: Validate hardened Compose topology
     env:
      POSTGRES_OWNER_PASSWORD: owner-ci-password
      POSTGRES_APP_PASSWORD: app-ci-password
      AUDITMESH_JWT_ISSUER: https://id.example
      AUDITMESH_OIDC_JWKS_URL: https://id.example/jwks
      AUDITMESH_BACKUP_KEY_BASE64: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
     run: docker compose config --quiet
 container:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
   - run: docker build -t auditmesh:ci .
   - run: docker run --rm --entrypoint python auditmesh:ci --version | grep -Fx 'Python 3.13.15'
   - run: docker inspect auditmesh:ci --format '{{.Config.User}}' | grep -Fx auditmesh
   - run: docker inspect auditmesh:ci --format '{{json .Config.Healthcheck}}' | grep -F health/ready
   - name: Generate SPDX SBOM
     id: sbom_primary
     continue-on-error: true
     uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
     with:
      image: auditmesh:ci
      format: spdx-json
      output-file: auditmesh-sbom.spdx.json
      upload-artifact: false
   - name: Retry SPDX SBOM generation after transient download failure
     if: steps.sbom_primary.outcome == 'failure'
     uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
     with:
      image: auditmesh:ci
      format: spdx-json
      output-file: auditmesh-sbom.spdx.json
      upload-artifact: false
   - name: Require generated SPDX SBOM
     run: test -s auditmesh-sbom.spdx.json
   - name: Validate time-bounded vulnerability exceptions
     run: python scripts/verify_vulnerability_exceptions.py
   - name: Block fixable High and Critical vulnerabilities
     uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
     with:
      sbom: auditmesh-sbom.spdx.json
      fail-build: true
      severity-cutoff: high
      only-fixed: true
      output-format: table
      config: .grype.yaml
   - name: Upload SBOM evidence
     uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
     with:
      name: auditmesh-sbom-${{ github.sha }}
      path: auditmesh-sbom.spdx.json
      retention-days: 30
 compose-smoke:
  runs-on: ubuntu-latest
  env:
   POSTGRES_OWNER_PASSWORD: owner-ci-password
   POSTGRES_APP_PASSWORD: app-ci-password
   AUDITMESH_JWT_ISSUER: https://id.example
   AUDITMESH_OIDC_JWKS_URL: https://id.example/jwks
   AUDITMESH_BACKUP_KEY_BASE64: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
   - run: docker compose up --build --detach
   - name: Wait for hardened API readiness
     run: |
      for attempt in $(seq 1 60); do
        if curl --fail --silent http://127.0.0.1:8082/health/ready; then exit 0; fi
        sleep 2
      done
      exit 1
   - if: always()
     run: docker compose ps --all && docker compose logs --no-color
   - if: always()
     run: docker compose down --volumes --remove-orphans
