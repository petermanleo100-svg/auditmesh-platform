groups:
  - name: auditmesh-api
    rules:
      - alert: AuditMeshHighErrorRate
        expr: sum(rate(auditmesh_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(auditmesh_http_requests_total[5m])), 0.001) > 0.01
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: AuditMesh API 5xx rate exceeds 1%
      - alert: AuditMeshP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(auditmesh_http_request_duration_seconds_bucket[10m]))) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: AuditMesh API p95 latency exceeds one second
      - alert: AuditMeshReadinessUnavailable
        expr: probe_success{job="auditmesh-readiness"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: AuditMesh readiness probe is unavailable
