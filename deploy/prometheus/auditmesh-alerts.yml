groups:
  - name: auditmesh-api
    rules:
      - alert: AuditMeshHighErrorRate
        expr: sum(rate(auditmesh_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(auditmesh_http_requests_total[5m])), 0.001) > 0.01
        for: 10m
        labels:
          severity: critical
          service: auditmesh
          owner: platform-operations
        annotations:
          summary: AuditMesh API 5xx rate exceeds 1%
          runbook_url: https://github.com/petermanleo100-svg/auditmesh-platform/blob/main/docs/production-runbook.md
      - alert: AuditMeshP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(auditmesh_http_request_duration_seconds_bucket[10m]))) > 1
        for: 15m
        labels:
          severity: warning
          service: auditmesh
          owner: platform-operations
        annotations:
          summary: AuditMesh API p95 latency exceeds one second
          runbook_url: https://github.com/petermanleo100-svg/auditmesh-platform/blob/main/docs/production-runbook.md
      - alert: AuditMeshReadinessUnavailable
        expr: probe_success{job="auditmesh-readiness"} == 0
        for: 2m
        labels:
          severity: critical
          service: auditmesh
          owner: platform-operations
        annotations:
          summary: AuditMesh readiness probe is unavailable
          runbook_url: https://github.com/petermanleo100-svg/auditmesh-platform/blob/main/docs/production-runbook.md
      - alert: AuditMeshOperationFailed
        expr: auditmesh_operation_success == 0
        for: 5m
        labels: {severity: critical, service: auditmesh, owner: platform-operations}
        annotations: {summary: "AuditMesh scheduled operation failed", runbook_url: "https://github.com/petermanleo100-svg/auditmesh-platform/blob/main/docs/production-runbook.md"}
      - alert: AuditMeshTextfileCollectorFailed
        expr: node_textfile_scrape_error{job="auditmesh-node-exporter"} == 1
        for: 5m
        labels: {severity: critical, service: auditmesh, owner: platform-operations}
        annotations: {summary: "AuditMesh operation metrics collector cannot read one or more textfiles", runbook_url: "https://github.com/petermanleo100-svg/auditmesh-platform/blob/main/docs/production-runbook.md"}
      - alert: AuditMeshBackupStale
        expr: (time() - auditmesh_operation_last_success_timestamp_seconds{operation="backup_create"} > 900) or absent(auditmesh_operation_last_success_timestamp_seconds{operation="backup_create"})
        for: 5m
        labels: {severity: critical, service: auditmesh, owner: platform-operations}
        annotations: {summary: "AuditMesh has no successful backup inside the 15-minute RPO window", runbook_url: "https://github.com/petermanleo100-svg/auditmesh-platform/blob/main/docs/production-runbook.md"}
      - alert: AuditMeshCriticalCaseOverdue
        expr: auditmesh_critical_overdue_cases > 0
        for: 5m
        labels: {severity: critical, service: auditmesh, owner: control-operations}
        annotations: {summary: "AuditMesh has one or more overdue critical cases", runbook_url: "https://github.com/petermanleo100-svg/auditmesh-platform/blob/main/docs/production-runbook.md"}
      - alert: AuditMeshSourceIngestionFailed
        expr: auditmesh_source_current_failures > 0
        for: 5m
        labels: {severity: critical, service: auditmesh, owner: integration-operations}
        annotations: {summary: "AuditMesh has one or more sources whose latest ingestion result failed", runbook_url: "https://github.com/petermanleo100-svg/auditmesh-platform/blob/main/docs/production-runbook.md"}
      - alert: AuditMeshSourceGap
        expr: auditmesh_source_gap_count > 0
        for: 5m
        labels: {severity: critical, service: auditmesh, owner: integration-operations}
        annotations: {summary: "AuditMesh has one or more sources beyond their heartbeat silence contract", runbook_url: "https://github.com/petermanleo100-svg/auditmesh-platform/blob/main/docs/production-runbook.md"}
      - alert: AuditMeshBusinessStatusExporterStale
        expr: (time() - auditmesh_operation_last_success_timestamp_seconds{operation="business_status_export"} > 600) or absent(auditmesh_operation_last_success_timestamp_seconds{operation="business_status_export"})
        for: 5m
        labels: {severity: critical, service: auditmesh, owner: platform-operations}
        annotations: {summary: "AuditMesh business status metrics are missing or older than ten minutes", runbook_url: "https://github.com/petermanleo100-svg/auditmesh-platform/blob/main/docs/production-runbook.md"}
